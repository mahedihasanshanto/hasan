<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Street Food</title>

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="logo/icons8-street-food-100.png">

  <!-- Custom CSS -->
  <link rel="stylesheet" href="style.css">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Creepster&family=Griffy&display=swap" rel="stylesheet">

  <!-- DaisyUI -->
  <link href="https://cdn.jsdelivr.net/npm/daisyui@4.12.24/dist/full.min.css" rel="stylesheet">

  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- Tailwind Custom Config -->
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            creepster: ['Creepster', 'cursive'],
            griffy: ['Griffy', 'cursive'],
          },
        },

    }

</head>

          <div class="flex gap-3 items-center">

            <a><img src="" class="w-5 h-5" alt="Facebook"></a>

            <a><img src="" class="w-5 h-5" alt="TikTok"></a>
